<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 260" width="1200" height="260">
  <defs>
    <filter id="cardshadow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur in="SourceAlpha" stdDeviation="5" result="blur"/>
      <feOffset dx="3" dy="5" result="offset"/>
      <feFlood flood-color="#000000" flood-opacity="0.53" result="color"/>
      <feComposite in="color" in2="offset" operator="in" result="shadow"/>
      <feMerge><feMergeNode in="shadow"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <filter id="textshadow" x="-10%" y="-20%" width="120%" height="150%">
      <feGaussianBlur in="SourceAlpha" stdDeviation="7" result="blur"/>
      <feOffset dx="0" dy="5" result="offset"/>
      <feFlood flood-color="#000000" flood-opacity="0.73" result="color"/>
      <feComposite in="color" in2="offset" operator="in" result="shadow"/>
      <feMerge><feMergeNode in="shadow"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <filter id="subtleglow">
      <feGaussianBlur stdDeviation="18" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <radialGradient id="bggrad" cx="58%" cy="50%" r="60%">
      <stop offset="0%" stop-color="#162540"/>
      <stop offset="100%" stop-color="#0d1b2a"/>
    </radialGradient>
    <linearGradient id="goldgrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#ffe066"/>
      <stop offset="45%" stop-color="#f5a623"/>
      <stop offset="100%" stop-color="#c47d0e"/>
    </linearGradient>
    <linearGradient id="linegrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#f5a623" stop-opacity="0"/>
      <stop offset="20%" stop-color="#f5a623"/>
      <stop offset="80%" stop-color="#f5a623"/>
      <stop offset="100%" stop-color="#f5a623" stop-opacity="0"/>
    </linearGradient>
  </defs>

  <!-- Background -->
  <rect width="1200" height="260" fill="url(#bggrad)"/>

  <!-- Faint suit symbols — fill right space decoratively -->
  <text x="850"  y="215" font-family="Georgia,serif" font-size="90"  fill="#1e3555" opacity="0.55" text-anchor="middle">♠</text>
  <text x="980"  y="110" font-family="Georgia,serif" font-size="72"  fill="#1e3555" opacity="0.45" text-anchor="middle">♥</text>
  <text x="1090" y="210" font-family="Georgia,serif" font-size="82"  fill="#1e3555" opacity="0.50" text-anchor="middle">♦</text>
  <text x="1165" y="125" font-family="Georgia,serif" font-size="64"  fill="#1e3555" opacity="0.40" text-anchor="middle">♣</text>

  <!-- Diamond shape behind card fan -->
  <polygon points="155,15 295,130 155,245 15,130" fill="#121e30" opacity="0.85"/>
  <polygon points="155,35 275,130 155,225 35,130" fill="none" stroke="#f5a623" stroke-width="2" opacity="0.75"/>

  <!-- Card fan — SVG drawn (no embedded images) -->

  <!-- Card 1 — leftmost, -28° -->
  <g transform="translate(72,132) rotate(-28)" filter="url(#cardshadow)">
    <rect x="-38" y="-54" width="76" height="108" rx="8" ry="8" fill="#e8dfc8"/>
    <rect x="-33" y="-49" width="66" height="98"  rx="6" ry="6" fill="white"/>
    <text x="-27" y="-30" font-family="Georgia,serif" font-size="17" fill="#c0392b" font-weight="bold">7</text>
    <text x="-25" y="-13" font-family="Georgia,serif" font-size="14" fill="#c0392b">♥</text>
    <text x="0"  y="34"  font-family="Georgia,serif" font-size="26" fill="#c0392b" text-anchor="middle">♥</text>
  </g>

  <!-- Card 2 — -10° -->
  <g transform="translate(112,122) rotate(-10)" filter="url(#cardshadow)">
    <rect x="-38" y="-54" width="76" height="108" rx="8" ry="8" fill="#e8dfc8"/>
    <rect x="-33" y="-49" width="66" height="98"  rx="6" ry="6" fill="white"/>
    <text x="-27" y="-30" font-family="Georgia,serif" font-size="17" fill="#1a1a2e" font-weight="bold">K</text>
    <text x="-25" y="-13" font-family="Georgia,serif" font-size="14" fill="#1a1a2e">♠</text>
    <text x="0"  y="34"  font-family="Georgia,serif" font-size="26" fill="#1a1a2e" text-anchor="middle">♠</text>
  </g>

  <!-- Card 3 — +8° -->
  <g transform="translate(162,118) rotate(8)" filter="url(#cardshadow)">
    <rect x="-38" y="-54" width="76" height="108" rx="8" ry="8" fill="#e8dfc8"/>
    <rect x="-33" y="-49" width="66" height="98"  rx="6" ry="6" fill="white"/>
    <text x="-27" y="-30" font-family="Georgia,serif" font-size="17" fill="#c0392b" font-weight="bold">A</text>
    <text x="-25" y="-13" font-family="Georgia,serif" font-size="14" fill="#c0392b">♦</text>
    <text x="0"  y="34"  font-family="Georgia,serif" font-size="28" fill="#c0392b" text-anchor="middle">♦</text>
  </g>

  <!-- Card 4 — +22° -->
  <g transform="translate(218,128) rotate(22)" filter="url(#cardshadow)">
    <rect x="-38" y="-54" width="76" height="108" rx="8" ry="8" fill="#e8dfc8"/>
    <rect x="-33" y="-49" width="66" height="98"  rx="6" ry="6" fill="white"/>
    <text x="-27" y="-30" font-family="Georgia,serif" font-size="17" fill="#1a1a2e" font-weight="bold">J</text>
    <text x="-25" y="-13" font-family="Georgia,serif" font-size="14" fill="#1a1a2e">♣</text>
    <text x="0"  y="34"  font-family="Georgia,serif" font-size="24" fill="#1a1a2e" text-anchor="middle">♣</text>
  </g>

  <!-- Soft glow halo behind title (very subtle) -->
  <ellipse cx="740" cy="128" rx="310" ry="85" fill="#f5a623" opacity="0.04" filter="url(#subtleglow)"/>

  <!-- AUTOBUS — white outline layer -->
  <text x="740" y="160"
    text-anchor="middle"
    font-family="'Arial Black','Impact',sans-serif"
    font-size="98" font-weight="900" letter-spacing="3"
    fill="none" stroke="white" stroke-width="9" stroke-linejoin="round"
    filter="url(#textshadow)"
  >AUTOBUS</text>

  <!-- AUTOBUS — gold fill -->
  <text x="740" y="160"
    text-anchor="middle"
    font-family="'Arial Black','Impact',sans-serif"
    font-size="98" font-weight="900" letter-spacing="3"
    fill="url(#goldgrad)"
  >AUTOBUS</text>

  <!-- Gold separator line — fades at edges -->
  <rect x="380" y="172" width="720" height="4" rx="2" fill="url(#linegrad)"/>

  <!-- Subtitle — larger, more tracked -->
  <text x="740" y="202"
    text-anchor="middle"
    font-family="'Arial','Verdana',sans-serif"
    font-size="18" font-weight="700" letter-spacing="8"
    fill="#4fc3f7" opacity="0.9"
  >THE CARD GAME</text>

</svg>
