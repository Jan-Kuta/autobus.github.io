<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 920 430" width="920" height="430">
  <defs>
    <filter id="cs" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur in="SourceAlpha" stdDeviation="5" result="blur"/>
      <feOffset dx="3" dy="7" result="off"/>
      <feFlood flood-color="#000" flood-opacity="0.60" result="col"/>
      <feComposite in="col" in2="off" operator="in" result="shad"/>
      <feMerge><feMergeNode in="shad"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <filter id="ts" x="-12%" y="-30%" width="124%" height="160%">
      <feGaussianBlur in="SourceAlpha" stdDeviation="11" result="blur"/>
      <feOffset dx="0" dy="8" result="off"/>
      <feFlood flood-color="#000" flood-opacity="0.80" result="col"/>
      <feComposite in="col" in2="off" operator="in" result="shad"/>
      <feMerge><feMergeNode in="shad"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <radialGradient id="bg" cx="65%" cy="50%" r="62%">
      <stop offset="0%" stop-color="#1c3252"/>
      <stop offset="100%" stop-color="#090f18"/>
    </radialGradient>
    <linearGradient id="gold" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#ffe066"/>
      <stop offset="45%" stop-color="#f5a623"/>
      <stop offset="100%" stop-color="#b86e08"/>
    </linearGradient>
    <linearGradient id="lg" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%"   stop-color="#f5a623" stop-opacity="0"/>
      <stop offset="12%"  stop-color="#f5a623"/>
      <stop offset="88%"  stop-color="#f5a623"/>
      <stop offset="100%" stop-color="#f5a623" stop-opacity="0"/>
    </linearGradient>
  </defs>

  <rect width="920" height="430" fill="url(#bg)"/>

  <!-- Faint suit symbols right -->
  <text x="818" y="380" font-family="Georgia,serif" font-size="200" fill="#1e3555" opacity="0.50" text-anchor="middle">♠</text>
  <text x="900" y="170" font-family="Georgia,serif" font-size="150" fill="#1e3555" opacity="0.38" text-anchor="middle">♥</text>

  <!-- Diamond -->
  <polygon points="178,32 334,215 178,398 22,215" fill="#0c1825" opacity="0.88"/>
  <polygon points="178,68 302,215 178,362 54,215" fill="none" stroke="#f5a623" stroke-width="2.5" opacity="0.80"/>

  <!-- Card fan (card: 90×128) -->
  <g transform="translate(95,215) rotate(-28)" filter="url(#cs)">
    <rect x="-45" y="-64" width="90" height="128" rx="8" fill="#e8dfc8"/>
    <rect x="-40" y="-58" width="80" height="116" rx="6" fill="white"/>
    <text x="-29" y="-36" font-family="Georgia,serif" font-size="21" fill="#c0392b" font-weight="bold">7</text>
    <text x="-25" y="-14" font-family="Georgia,serif" font-size="17" fill="#c0392b">♥</text>
    <text x="0"   y="44"  font-family="Georgia,serif" font-size="33" fill="#c0392b" text-anchor="middle">♥</text>
  </g>
  <g transform="translate(154,198) rotate(-10)" filter="url(#cs)">
    <rect x="-45" y="-64" width="90" height="128" rx="8" fill="#e8dfc8"/>
    <rect x="-40" y="-58" width="80" height="116" rx="6" fill="white"/>
    <text x="-29" y="-36" font-family="Georgia,serif" font-size="21" fill="#1a1a2e" font-weight="bold">K</text>
    <text x="-25" y="-14" font-family="Georgia,serif" font-size="17" fill="#1a1a2e">♠</text>
    <text x="0"   y="44"  font-family="Georgia,serif" font-size="33" fill="#1a1a2e" text-anchor="middle">♠</text>
  </g>
  <g transform="translate(216,193) rotate(8)" filter="url(#cs)">
    <rect x="-45" y="-64" width="90" height="128" rx="8" fill="#e8dfc8"/>
    <rect x="-40" y="-58" width="80" height="116" rx="6" fill="white"/>
    <text x="-29" y="-36" font-family="Georgia,serif" font-size="21" fill="#c0392b" font-weight="bold">A</text>
    <text x="-25" y="-14" font-family="Georgia,serif" font-size="17" fill="#c0392b">♦</text>
    <text x="0"   y="44"  font-family="Georgia,serif" font-size="37" fill="#c0392b" text-anchor="middle">♦</text>
  </g>
  <g transform="translate(278,207) rotate(22)" filter="url(#cs)">
    <rect x="-45" y="-64" width="90" height="128" rx="8" fill="#e8dfc8"/>
    <rect x="-40" y="-58" width="80" height="116" rx="6" fill="white"/>
    <text x="-29" y="-36" font-family="Georgia,serif" font-size="21" fill="#1a1a2e" font-weight="bold">J</text>
    <text x="-25" y="-14" font-family="Georgia,serif" font-size="17" fill="#1a1a2e">♣</text>
    <text x="0"   y="44"  font-family="Georgia,serif" font-size="30" fill="#1a1a2e" text-anchor="middle">♣</text>
  </g>

  <text x="610" y="254" text-anchor="middle"
    font-family="'Arial Black','Impact',sans-serif"
    font-size="144" font-weight="900"
    textLength="510" lengthAdjust="spacingAndGlyphs"
    fill="none" stroke="white" stroke-width="13" stroke-linejoin="round"
    filter="url(#ts)"
  >AUTOBUS</text>
  <text x="610" y="254" text-anchor="middle"
    font-family="'Arial Black','Impact',sans-serif"
    font-size="144" font-weight="900"
    textLength="510" lengthAdjust="spacingAndGlyphs"
    fill="url(#gold)"
  >AUTOBUS</text>

  <rect x="355" y="274" width="510" height="5" rx="2.5" fill="url(#lg)"/>

  <text x="610" y="318" text-anchor="middle"
    font-family="'Arial','Verdana',sans-serif"
    font-size="26" font-weight="700" letter-spacing="10"
    fill="#4fc3f7" opacity="0.9"
  >THE CARD GAME</text>
</svg>
