<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 462 174" width="462" height="174">
  <defs>
    <filter id="cs" x="-25%" y="-25%" width="150%" height="150%">
      <feGaussianBlur in="SourceAlpha" stdDeviation="3" result="blur"/>
      <feOffset dx="2" dy="4" result="off"/>
      <feFlood flood-color="#000" flood-opacity="0.55" result="col"/>
      <feComposite in="col" in2="off" operator="in" result="shad"/>
      <feMerge><feMergeNode in="shad"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <filter id="ts" x="-12%" y="-35%" width="124%" height="170%">
      <feGaussianBlur in="SourceAlpha" stdDeviation="7" result="blur"/>
      <feOffset dx="0" dy="5" result="off"/>
      <feFlood flood-color="#000" flood-opacity="0.80" result="col"/>
      <feComposite in="col" in2="off" operator="in" result="shad"/>
      <feMerge><feMergeNode in="shad"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <radialGradient id="bg" cx="62%" cy="50%" r="65%">
      <stop offset="0%" stop-color="#1c3252"/>
      <stop offset="100%" stop-color="#090f18"/>
    </radialGradient>
    <linearGradient id="gold" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#ffe066"/>
      <stop offset="45%" stop-color="#f5a623"/>
      <stop offset="100%" stop-color="#b86e08"/>
    </linearGradient>
    <linearGradient id="lg" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%"   stop-color="#f5a623" stop-opacity="0"/>
      <stop offset="15%"  stop-color="#f5a623"/>
      <stop offset="85%"  stop-color="#f5a623"/>
      <stop offset="100%" stop-color="#f5a623" stop-opacity="0"/>
    </linearGradient>
  </defs>

  <rect width="462" height="174" fill="url(#bg)"/>

  <!-- Faint suit right -->
  <text x="422" y="155" font-family="Georgia,serif" font-size="96" fill="#1e3555" opacity="0.45" text-anchor="middle">♠</text>

  <!-- Diamond -->
  <polygon points="88,14 162,87 88,160 14,87" fill="#0c1825" opacity="0.85"/>
  <polygon points="88,30 146,87 88,144 30,87" fill="none" stroke="#f5a623" stroke-width="1.5" opacity="0.80"/>

  <!-- Card fan (card: 46×66) -->
  <g transform="translate(48,87) rotate(-24)" filter="url(#cs)">
    <rect x="-23" y="-33" width="46" height="66" rx="5" fill="#e8dfc8"/>
    <rect x="-20" y="-30" width="40" height="60" rx="4" fill="white"/>
    <text x="-14" y="-16" font-family="Georgia,serif" font-size="11" fill="#c0392b" font-weight="bold">7</text>
    <text x="-12" y="-5"  font-family="Georgia,serif" font-size="9"  fill="#c0392b">♥</text>
    <text x="0"   y="22"  font-family="Georgia,serif" font-size="16" fill="#c0392b" text-anchor="middle">♥</text>
  </g>
  <g transform="translate(76,80) rotate(-8)" filter="url(#cs)">
    <rect x="-23" y="-33" width="46" height="66" rx="5" fill="#e8dfc8"/>
    <rect x="-20" y="-30" width="40" height="60" rx="4" fill="white"/>
    <text x="-14" y="-16" font-family="Georgia,serif" font-size="11" fill="#1a1a2e" font-weight="bold">K</text>
    <text x="-12" y="-5"  font-family="Georgia,serif" font-size="9"  fill="#1a1a2e">♠</text>
    <text x="0"   y="22"  font-family="Georgia,serif" font-size="16" fill="#1a1a2e" text-anchor="middle">♠</text>
  </g>
  <g transform="translate(107,77) rotate(8)" filter="url(#cs)">
    <rect x="-23" y="-33" width="46" height="66" rx="5" fill="#e8dfc8"/>
    <rect x="-20" y="-30" width="40" height="60" rx="4" fill="white"/>
    <text x="-14" y="-16" font-family="Georgia,serif" font-size="11" fill="#c0392b" font-weight="bold">A</text>
    <text x="-12" y="-5"  font-family="Georgia,serif" font-size="9"  fill="#c0392b">♦</text>
    <text x="0"   y="22"  font-family="Georgia,serif" font-size="18" fill="#c0392b" text-anchor="middle">♦</text>
  </g>
  <g transform="translate(137,83) rotate(22)" filter="url(#cs)">
    <rect x="-23" y="-33" width="46" height="66" rx="5" fill="#e8dfc8"/>
    <rect x="-20" y="-30" width="40" height="60" rx="4" fill="white"/>
    <text x="-14" y="-16" font-family="Georgia,serif" font-size="11" fill="#1a1a2e" font-weight="bold">J</text>
    <text x="-12" y="-5"  font-family="Georgia,serif" font-size="9"  fill="#1a1a2e">♣</text>
    <text x="0"   y="22"  font-family="Georgia,serif" font-size="15" fill="#1a1a2e" text-anchor="middle">♣</text>
  </g>

  <text x="305" y="98" text-anchor="middle"
    font-family="'Arial Black','Impact',sans-serif"
    font-size="68" font-weight="900"
    textLength="240" lengthAdjust="spacingAndGlyphs"
    fill="none" stroke="white" stroke-width="7" stroke-linejoin="round"
    filter="url(#ts)"
  >AUTOBUS</text>
  <text x="305" y="98" text-anchor="middle"
    font-family="'Arial Black','Impact',sans-serif"
    font-size="68" font-weight="900"
    textLength="240" lengthAdjust="spacingAndGlyphs"
    fill="url(#gold)"
  >AUTOBUS</text>

  <rect x="185" y="110" width="240" height="3" rx="1.5" fill="url(#lg)"/>

  <text x="305" y="132" text-anchor="middle"
    font-family="'Arial','Verdana',sans-serif"
    font-size="13" font-weight="700" letter-spacing="5"
    fill="#4fc3f7" opacity="0.9"
  >THE CARD GAME</text>
</svg>
